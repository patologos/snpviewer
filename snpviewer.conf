# SNP Viewer Configuration File
# ============================================================
# Lines starting with '#' are comments and are ignored.
# Keys are case-insensitive. Extra whitespace is ignored.
# Unknown keys are silently ignored so you can add your own notes.
#
# Location: place this file in the same directory as snpviewer.py,
# or in your home directory as ~/.snpviewer.conf
# The file next to snpviewer.py takes precedence.
# ============================================================


# ------------------------------------------------------------
# Parameter type displayed on startup
# ------------------------------------------------------------
# Which parameter type to show when the application starts.
# Allowed values: S, Z, Y
#
# S = Scattering parameters (default, dimensionless)
# Z = Impedance parameters (Ohms)
# Y = Admittance parameters (Siemens)

param_type = S


# ------------------------------------------------------------
# Default S-parameter selections
# ------------------------------------------------------------
# Which S-parameters to check by default when a file is loaded.
# Applies only when param_type = S (or when the user switches to S).
#
# Format: comma-separated list of MN pairs (row, column), e.g.
#   s_default_params = 11, 21
# means S1,1 and S2,1 are pre-checked.
#
# Use 'all' to pre-check every available parameter.
# Use 'none' to start with no parameters checked.
#
# Examples:
#   s_default_params = 11          (only S1,1)
#   s_default_params = 11, 21      (S1,1 and S2,1 - common for 2-port)
#   s_default_params = all
#   s_default_params = none

s_default_params = 21


# ------------------------------------------------------------
# Default Z-parameter selections
# ------------------------------------------------------------
# Same format as s_default_params but applied when param_type = Z.

z_default_params = 11


# ------------------------------------------------------------
# Default Y-parameter selections
# ------------------------------------------------------------
# Same format as s_default_params but applied when param_type = Y.

y_default_params = 11


# ------------------------------------------------------------
# Default plot format
# ------------------------------------------------------------
# Initial magnitude display format.
# Allowed values: DB, MA, RI
#
# DB = Decibels (dB) - most common for S-parameters
# MA = Magnitude (linear, absolute value)
# RI = Real / Imaginary parts

plot_format = DB


# ------------------------------------------------------------
# Default reference impedance (Z0)
# ------------------------------------------------------------
# System reference impedance in Ohms, used for S<->Z<->Y conversion.
# Typical values: 50 (RF), 75 (cable TV / video), 600 (audio)

z0 = 50.0


# ============================================================
# Graph / Font Settings
# ============================================================

# ------------------------------------------------------------
# Font family
# ------------------------------------------------------------
# The font family used for all text in the plot.
# Common values: sans-serif, serif, monospace
# You can also name a specific font, e.g.: Arial, Helvetica,
# Times New Roman, Courier New, DejaVu Sans

font_family = sans-serif


# ------------------------------------------------------------
# Font sizes (integer, points)
# ------------------------------------------------------------
# font_size   : base size for general body text       (default 10)
# label_size  : axis label text (x/y labels)          (default 11)
# title_size  : plot title                             (default 12)
# tick_size   : axis tick labels                       (default  9)
# legend_size : legend entries                         (default  9)

# font_size   = 10
font_size   = 18
# label_size  = 11
label_size  = 14
title_size  = 12
tick_size   = 14
#legend_size = 9
legend_size = 24


# ============================================================
# Custom Color Palettes
# ============================================================

# ------------------------------------------------------------
# Default palette
# ------------------------------------------------------------
# Which palette to select on startup.
# Can be any built-in name (Nature, IEEE, Colorblind (Wong),
# Tableau, Grayscale) or a custom palette defined below.
#
default_palette = Nature


# ------------------------------------------------------------
# Custom palettes
# ------------------------------------------------------------
# Define custom palettes using:
#   palette_<Name> = #hex1, #hex2, #hex3, ...
#
# The Name (after palette_) becomes the palette's display name.
# At least 2 colors are required.  More colors = more traces
# before the cycle repeats.
#
# Examples:
#   palette_Warm    = #D32F2F, #F57C00, #FBC02D, #689F38, #455A64
#   palette_Pastel  = #AEC6CF, #FFB347, #B39EB5, #FF6961, #77DD77
#   palette_Company = #1A73E8, #EA4335, #FBBC04, #34A853, #5F6368

    palette_IBMD =    #495057, #2A9D8F, #E63946, #DC267F, #FE6100, #FFB000
    palette_IBME =    #ffb000, #fe6100, #dc267f, #785ef0, #648fff
